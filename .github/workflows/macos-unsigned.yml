# Unsigned macOS build for personal use.
#
# Fork-only helper: the upstream release workflow signs and notarizes with
# Apple Developer secrets a fork does not have, so this workflow builds the
# same app WITHOUT signing. The resulting .dmg/.app runs, but Gatekeeper
# quarantines it: on first launch, right-click -> Open, or run
#   xattr -dr com.apple.quarantine /Applications/Readest.app
#
# Trigger it by hand from the Actions tab (workflow_dispatch), then download
# the dmg from the run's Artifacts section.
name: macOS unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macos-14 is Apple silicon, so the aarch64 target builds natively.
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: setup node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      # No SENTRY_AUTH_TOKEN, so upload-sourcemaps no-ops (it still strips the
      # maps) — a fork build has nothing to report to Sentry anyway.
      - name: build the dmg
        env:
          # Unsigned: leaving every APPLE_* secret unset makes Tauri skip
          # codesign and notarization rather than fail on missing values.
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: cd apps/readest-app && pnpm tauri build --target aarch64-apple-darwin

      - name: upload the dmg
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: readest-macos-aarch64-unsigned
          path: |
            apps/readest-app/src-tauri/target/release/bundle/dmg/*.dmg
            apps/readest-app/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
